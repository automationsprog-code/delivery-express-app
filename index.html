    <meta name="theme-color" content="#e11d48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Delivery Express" />
    <title>Delivery Express | Anything, Anywhere!</title>
    <meta name="description" content="Your first choice in delivery. Food, Pasabuy, Cakes, Medicine, Errands & Parcels across Balamban, Asturias, Toledo, Tuburan & West Cebu" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->

    <style>
      html, body {
        overflow-x: hidden;
        max-width: 100vw;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      h1, h2, h3, h4, .font-heading {
        font-family: 'Outfit', sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen transition-colors duration-200 antialiased bg-slate-50 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 overflow-x-hidden w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clear any stale cached service workers so mobile always receives latest bundle
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
    </script>
  </body>
</html>
